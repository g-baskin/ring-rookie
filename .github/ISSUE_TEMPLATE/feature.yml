name: Feature request
description: Propose a product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem or opportunity}
    validations: {required: true}
  - type: textarea
    id: solution
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives and tradeoffs}
